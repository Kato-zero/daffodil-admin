<style>
:root{
  --leaf:#0e3b2c;--leaf2:#082a1f;--stem:#2b7a57;--sage:#e4eee2;--paper:#f6f6ee;
  --petal:#f7c62f;--petal2:#fbd95c;--butter:#fdf1c2;
  --ink:#15221c;--muted:#56655d;--line:#d8e2d6;--danger:#a3332b;--ok:#1f7a4f;
  --display:"Fraunces",Georgia,serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 24px 60px -28px rgba(14,59,44,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.15;margin:0 0 .5em}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--petal);outline-offset:3px;border-radius:6px}
.wrap{width:min(1280px,calc(100% - 40px));margin-inline:auto}
.topbar{background:var(--leaf);color:#fff;padding:14px 0;position:sticky;top:0;z-index:50;box-shadow:0 4px 20px -10px rgba(0,0,0,.4)}
.topbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.15rem;text-decoration:none;color:#fff}
.topbar .dot{width:28px;height:28px;border-radius:50%;background:var(--petal);display:grid;place-items:center;color:var(--leaf);font-weight:700;font-family:var(--display)}
.topbar nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.topbar nav a{padding:8px 14px;border-radius:999px;text-decoration:none;font-size:.92rem;font-weight:500;color:#dbe9df}
.topbar nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.topbar nav a.on{background:var(--petal);color:#2b2506;font-weight:700}
.who{display:flex;align-items:center;gap:10px;font-size:.86rem;color:#b8cec2;padding-left:8px;border-left:1px solid rgba(255,255,255,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:999px;border:2px solid transparent;text-decoration:none;font-weight:700;font-size:.95rem;line-height:1.2;transition:transform .15s,background .15s;cursor:pointer}
.btn:hover{transform:translateY(-1px)}
.btn:focus-within{outline:3px solid var(--petal);outline-offset:3px}
.btn-primary{background:var(--petal);color:#2b2506}
.btn-primary:hover{background:var(--petal2)}
.btn-dark{background:var(--leaf);color:#fff}
.btn-dark:hover{background:var(--stem)}
.btn-outline{border-color:var(--line);background:#fff;color:var(--ink)}
.btn-outline:hover{background:var(--sage)}
.btn-danger{background:transparent;border-color:#ecc8c4;color:var(--danger)}
.btn-danger:hover{background:#fdecea}
.btn-sm{min-height:34px;padding:6px 12px;font-size:.82rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.page{padding:28px 0 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:20px}
.card h2{margin-bottom:6px;font-size:1.5rem}
.card .sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:.9rem}
.field input,.field textarea,.field select{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fbfcfa;outline:none;font-size:.95rem;transition:border-color .15s,box-shadow .15s;font-family:inherit}
.field textarea{min-height:120px;resize:vertical;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--stem);box-shadow:0 0 0 4px rgba(43,122,87,.14)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:640px){.row,.row-3{grid-template-columns:1fr}}
.status{font-weight:600;margin:12px 0 0;font-size:.92rem;min-height:1.1em}
.status.err{color:var(--danger)}
.status.ok{color:var(--ok)}
.login{max-width:440px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}
.login h1{font-size:2rem;margin-bottom:6px}
.login .sub{color:var(--muted);margin:0 0 24px}
.grid-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.slot{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.slot.uploading{opacity:.5;pointer-events:none}
.slot .thumb{aspect-ratio:4/3;background:linear-gradient(160deg,var(--stem),var(--leaf)) center/40% no-repeat;position:relative;overflow:hidden}
.slot .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .thumb .empty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.7);font-size:.82rem;text-align:center;padding:12px;border:0}
.slot .info{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.slot .info b{font-size:.9rem;font-weight:600;word-break:break-word}
.slot .info small{color:var(--muted);font-size:.75rem;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.slot .acts{display:flex;gap:6px;padding:0 12px 12px}
.slot .acts label,.slot .acts button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;justify-content:center;flex:1}
.slot .acts label:hover,.slot .acts button:hover{background:var(--sage)}
.slot .acts input[type=file]{display:none}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:26px 0 14px;flex-wrap:wrap}
.section-head h3{margin:0;font-size:1.2rem}
.section-head .hint{color:var(--muted);font-size:.85rem;margin:0}
.pill{display:inline-block;background:var(--sage);color:var(--leaf);font-weight:600;font-size:.78rem;padding:3px 10px;border-radius:999px}
.pill.new{background:var(--butter);color:#5b4a06}
.pill.ok{background:#d8f0e0;color:#1f5a37}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:.86rem;font-weight:600;color:var(--muted)}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--leaf);border-bottom-color:var(--leaf)}
.list-item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fbfcfa;display:flex;gap:12px;align-items:flex-start}
.list-item .grow{flex:1;min-width:0}
.list-item .grow input,.list-item .grow textarea,.list-item .grow select{margin-bottom:8px}
.list-item .grow textarea{min-height:70px}
.list-item .drag{cursor:grab;color:var(--muted);padding-top:6px;font-size:1.1rem;user-select:none}
.list-item .del{border:0;background:none;color:var(--danger);font-weight:600;padding:6px 4px;font-size:.85rem}
.empty{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--leaf);color:#fff;padding:12px 20px;border-radius:999px;z-index:500;opacity:0;pointer-events:none;transition:all .25s;box-shadow:var(--shadow);font-weight:500}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--sage);border-top-color:var(--stem);border-radius:50%;animation:sp 0.8s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Gallery photo manager */
.gal-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:4px 0 10px}
.gal-photos:empty{display:none}
.gthumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--sage);border:1px solid var(--line)}
.gthumb img{width:100%;height:100%;object-fit:cover;display:block}
.gthumb .rm{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(8,42,31,.78);color:#fff;font-size:1.05rem;line-height:1;display:grid;place-items:center;padding:0}
.gthumb .rm:hover{background:var(--danger)}
.gal-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gal-status{font-size:.86rem;color:var(--muted);font-weight:600}

/* Expandable sections */
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
details.acc>summary,details.acc-plain>summary,details.item>summary{cursor:pointer;display:flex;align-items:center;gap:12px}
details.acc>summary::after,details.acc-plain>summary::after,details.item>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px auto;flex:none;transition:transform .2s}
details[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
details.acc>summary>div{flex:1;min-width:0}
details.acc>summary h2{margin:0}
details.acc>summary .sub{margin:2px 0 0}
.acc-body{margin-top:18px}
details.acc-plain{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px}
details.acc-plain>summary h3{margin:0;flex:1}
.acc-plain .grid-images{margin-top:16px}
.list-item.item{display:block;padding:0}
.item>summary{padding:12px 14px}
.item>summary .item-title{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item>summary .del{flex:none}
.item-body{padding:2px 14px 14px}
.head-acts{display:flex;gap:8px;flex-wrap:wrap}
/* Photo upload field */
.pf-cap{font-weight:600;font-size:.9rem;margin:6px 0 6px}
.pf{display:flex;gap:12px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.pf-thumb{width:96px;height:96px;border-radius:12px;background:var(--sage);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.78rem;text-align:center;flex:none}
.pf-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pf-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pf-status{font-size:.86rem;color:var(--muted);font-weight:600}
</style>

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let toastT;function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600)}

/* ---------- Supabase REST helpers (auth-aware) ---------- */
const SB=CONFIG.supabase;
const baseUrl=()=>SB.url.replace(/\/$/,"");
const session=()=>LS.get("dc_admin",null);
const setSession=s=>LS.set("dc_admin",s);
function authHeaders(){
  const s=session();
  const h={apikey:SB.anonKey,"Content-Type":"application/json"};
  if(s&&s.access_token)h.Authorization="Bearer "+s.access_token;
  else h.Authorization="Bearer "+SB.anonKey;
  return h;
}
async function sb(path,{method="GET",body,headers={}}={}){
  const r=await fetch(baseUrl()+"/rest/v1/"+path,{method,headers:{...authHeaders(),...headers},body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}

/* ---------- auth ---------- */
async function signIn(email,password){
  const r=await fetch(baseUrl()+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{"Content-Type":"application/json",apikey:SB.anonKey},
    body:JSON.stringify({email,password})
  });
  if(!r.ok)throw new Error("Invalid email or password");
  const data=await r.json();
  setSession({email,access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+data.expires_in*1000});
  return data;
}
function signOut(){LS.set("dc_admin",null)}

/* ---------- state ---------- */
const STATE={
  content:{},          // key -> value
  images:[],           // [{key,url}]
  vents:[],            // for admin view
  storyReplies:[],     // for admin view
  tab:"images",
  open:{},
  loading:false
};
const DEFAULT_IMAGE_KEYS=[
  {key:"logo",label:"Site logo",group:"Brand"},
  {key:"photos.hero",label:"Home hero",group:"Home"},
  {key:"photos.meetup1",label:"Meetup 1",group:"Home"},
  {key:"photos.meetup2",label:"Meetup 2",group:"Home"},
  {key:"photos.meetup3",label:"Meetup 3",group:"Home"},
  {key:"photos.meetup4",label:"Meetup 4",group:"Home"},
  {key:"photos.meetup5",label:"Meetup 5",group:"Home"},
  {key:"photos.outreach",label:"Community outreach",group:"Home"},
  {key:"photos.mentorship",label:"Mentorship",group:"Home"}
];

/* ---------- data load ---------- */
async function loadAll(){
  STATE.loading=true;
  try{
    const [c,i,v,sr]=await Promise.all([
      sb("site_content?select=key,value"),
      sb("site_images?select=key,url,updated_at"),
      sb("vents?select=id,created_at,handle,mood,body,hidden,reports,replies:vent_replies(count)&order=created_at.desc&limit=200").catch(()=>[]),
      sb("story_replies?select=id,story_id,created_at,handle,body&order=created_at.desc&limit=500").catch(()=>[])
    ]);
    STATE.content={};c.forEach(r=>{STATE.content[r.key]=r.value});
    STATE.images=i;
    STATE.vents=v||[];
    STATE.storyReplies=sr||[];
  }catch(e){console.error(e);toast("Couldn't load: "+(e.message||e))}
  STATE.loading=false;
}

/* ---------- content write ---------- */
async function upsertContent(key,value){
  await sb("site_content?on_conflict=key",{method:"POST",
    headers:{Prefer:"resolution=merge-duplicates,return=representation"},
    body:[{key,value,updated_at:new Date().toISOString()}]});
  STATE.content[key]=value;
}
async function deleteContent(key){
  await sb(`site_content?key=eq.${encodeURIComponent(key)}`,{method:"DELETE"});
  delete STATE.content[key];
}

/* ---------- image upload ---------- */
/* Uploads one file to the storage bucket and returns its public URL. */
async function uploadFile(prefix,file){
  const s=session();if(!s)throw new Error("Not signed in");
  if(file.size>50*1024*1024)throw new Error("Image is too large (max 50 MB)");
  const ext=((file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,""))||"jpg";
  const path=`${prefix}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const up=await fetch(`${baseUrl()}/storage/v1/object/${SB.bucket}/${path}`,{
    method:"POST",
    headers:{Authorization:"Bearer "+s.access_token,apikey:SB.anonKey,"Content-Type":file.type||"image/jpeg","x-upsert":"true"},
    body:file
  });
  if(!up.ok)throw new Error(await up.text());
  return `${baseUrl()}/storage/v1/object/public/${SB.bucket}/${path}`;
}
async function uploadImage(key,file){
  const safe=key.replace(/[^a-z0-9._-]/gi,"_");
  const url=await uploadFile(safe,file);
  await sb("site_images?on_conflict=key",{method:"POST",
    headers:{Prefer:"resolution=merge-duplicates,return=representation"},
    body:[{key,url,updated_at:new Date().toISOString()}]});
  const existing=STATE.images.find(x=>x.key===key);
  if(existing)existing.url=url;else STATE.images.push({key,url});
  return url;
}
async function removeImage(key){
  await sb(`site_images?key=eq.${encodeURIComponent(key)}`,{method:"DELETE"});
  STATE.images=STATE.images.filter(x=>x.key!==key);
}

/* ---------- IMAGES TAB ---------- */
function renderImages(){
  const slots=imageSlots();
  const groups=[...new Set(slots.map(s=>s.group))];
  const missing=slots.filter(s=>!imageUrlFor(s.key)).length;
  $("#app").innerHTML=`
    <div class="section-head"><div><h2 style="margin:0">Images</h2><p class="hint">Upload or replace site-wide images. Changes appear instantly. Team, story, event and gallery photos are uploaded inside their sections on the Content tab.</p></div>
    <div class="head-acts"><span class="pill">${slots.length} slots</span> ${missing?`<span class="pill new">${missing} missing</span>`:'<span class="pill ok">All set</span>'}
    <button class="btn btn-outline btn-sm" data-expand="all">Expand all</button><button class="btn btn-outline btn-sm" data-expand="none">Collapse all</button></div></div>
    ${groups.map(g=>{
      const list=slots.filter(s=>s.group===g),miss=list.filter(s=>!imageUrlFor(s.key)).length,id="img-"+g;
      return `<details class="acc-plain" data-acc="${esc(id)}" ${STATE.open[id]?"open":""}><summary><h3>${esc(g)}</h3><span class="pill">${list.length} slot${list.length>1?"s":""}</span>${miss?`<span class="pill new">${miss} missing</span>`:""}</summary>
      <div class="grid-images">${list.map(slotCard).join("")}</div></details>`}).join("")}
  `;
  $$("[data-upload]").forEach(inp=>{
    inp.addEventListener("change",async e=>{
      const key=e.target.dataset.upload,file=e.target.files[0];
      if(!file)return;
      const slot=e.target.closest(".slot");slot.classList.add("uploading");
      try{await uploadImage(key,file);toast("Uploaded");renderImages()}
      catch(err){toast("Upload failed: "+(err.message||err));slot.classList.remove("uploading")}
    });
  });
  $$("[data-remove]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      if(!confirm("Remove this image? The public site will fall back to any default."))return;
      try{await removeImage(btn.dataset.remove);toast("Removed");renderImages()}
      catch(err){toast("Couldn't remove: "+(err.message||err))}
    });
  });
}
function slotCard(s){

    <div class="thumb">${url?`<img src="${esc(url)}" alt="${esc(s.label)}" referrerpolicy="no-referrer">`:`<div class="empty">No image yet</div>`}</div>

  const attrs=opts.slot?`data-slot="${opts.slot}"`:`data-prefix="${esc(opts.prefix||"misc")}"`;
  return `<div class="pf" data-photo ${attrs} data-url="${esc(url||"")}">${pfInner(url)}</div>`;
}

function slotKeyFor(box){

async function addGalleryPhotos(row,files){
  const box=$(".gal-photos",row),st=$(".gal-status",row);
  row.dataset.busy="1";
  let done=0,fail=0;
  for(const f of files){
    st.textContent=`Uploading ${done+fail+1} of ${files.length}…`;
    try{const url=await uploadFile("gallery",f);box.insertAdjacentHTML("beforeend",galleryThumb(url));done++}
    catch(e){fail++;toast("Upload failed: "+(e.message||e))}
  }
  delete row.dataset.busy;
  st.textContent=done?`${done} photo${done>1?"s":""} added. Press Save to publish.`:"";
}

/* collect rows back into arrays */
function collectRows(containerSel,rowSel,fieldsFn){
  const out=[];
  $$(containerSel+" "+rowSel).forEach(row=>{
    const o=fieldsFn(row);
    if(o)out.push(o);
  });
  return out;
}
function wireContentSaves(){
  // add buttons
  const add=(id,listSel,tpl)=>{const b=$(id);if(!b)return;b.addEventListener("click",()=>{
    const list=$(listSel);const tmp=document.createElement("div");tmp.innerHTML=tpl({},list.children.length);
    const el=tmp.firstElementChild;if(el.tagName==="DETAILS")el.open=true;
    list.appendChild(el);wireDeletes();
  })};
  add("#addStat","#statsList",statRow);
  add("#addProgram","#programsList",programRow);
  add("#addEvent","#eventsList",eventRow);
  add("#addGallery","#galleryList",galleryRow);
  add("#addTeam","#teamList",teamRow);
  add("#addStory","#storiesList",storyRow);
  wireDeletes();
  // gallery photo uploads / removals (delegated so newly added gallery events work too)
  const gl=$("#galleryList");
  if(gl){
    gl.addEventListener("change",e=>{
      const inp=e.target.closest("[data-gal-upload]");
      if(!inp||!inp.files.length)return;
      const row=inp.closest("[data-gallery]"),files=[...inp.files];
      inp.value="";
      addGalleryPhotos(row,files);
    });
    gl.addEventListener("click",e=>{
      const b=e.target.closest("[data-rm-photo]");
      if(b)b.closest(".gthumb").remove();
    });
  }
  $$("[data-save-block]").forEach(b=>b.addEventListener("click",()=>saveBlock(b.dataset.saveBlock)));
}
function wireDeletes(){
  $$("[data-del]").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();b.closest(".list-item").remove()});
}
async function saveBlock(block){
  const st=$("#st-"+block);
  const set=(t,c)=>{if(st){st.textContent=t;st.className="status "+c}};
  const listSel={gallery:"#galleryList",team:"#teamList",stories:"#storiesList",events:"#eventsList"}[block];
  if(listSel&&$(listSel+" [data-busy]")){set("Photos are still uploading. Try again in a moment.","err");return}
  set("Saving…","");
  try{
    if(block==="identity"){
      const keys=["site.email","site.phone","site.whatsapp","site.location","site.brand_name","site.notice","site.footer_blurb"];
      for(const k of keys){
        const el=$(`[data-content="${k}"]`);
        if(el)await upsertContent(k,el.value);
      }
    }
    if(block==="social"){
      const social={};
      ["Facebook","Instagram","TikTok","LinkedIn"].forEach(k=>{
        const el=$("#social-"+k);if(el&&el.value.trim())social[k]=el.value.trim();
      });
      await upsertContent("site.social",social);
    }
    if(block==="home"){
      const keys=["home.hero_title","home.hero_lede","home.motto","home.people_heading","home.people_lede","home.band_heading","home.band_text","home.room_heading","home.room_lede","home.involved_heading","home.involved_lede"];
      for(const k of keys){
        const el=$(`[data-content="${k}"]`);
        if(el)await upsertContent(k,el.value);
      }
    }
    if(block==="stats"){
      const stats=collectRows("#statsList","[data-stat]",row=>{
        const g=f=>row.querySelector(`[data-f="${f}"]`);
        const n=parseInt(g("n").value,10);
        if(!n&&n!==0)return null;
        return {n:n||0,suffix:g("suffix").value.trim(),label:g("label").value.trim(),plain:g("plain").checked||undefined};
      });
      await upsertContent("site.stats",stats);
    }
    if(block==="programs"){
      const programs=collectRows("#programsList","[data-program]",row=>{
        const g=f=>row.querySelector(`[data-f="${f}"]`);
        const name=g("name").value.trim();
        if(!name)return null;
        return {icon:g("icon").value.trim()||"heart",name,short:g("short").value.trim(),body:g("body").value.trim(),points:g("points").value.split("\n").map(x=>x.trim()).filter(Boolean)};
      });
      await upsertContent("programs",programs);
    }
    if(block==="events"){
      const events=collectRows("#eventsList","[data-event]",row=>{
        const g=f=>row.querySelector(`[data-f="${f}"]`);
        const title=g("title").value.trim();
        if(!title)return null;
        return {date:g("date").value.trim(),title,venue:g("venue").value.trim(),text:g("text").value.trim()};
      });
      await upsertContent("events",events);
    }
    if(block==="gallery"){
      const gallery=collectRows("#galleryList","[data-gallery]",row=>{
        const g=f=>row.querySelector(`[data-f="${f}"]`);
        const title=g("title").value.trim();
        if(!title)return null;
        const photos=$$(".gthumb",row).map(t=>t.dataset.url).filter(Boolean);
        return {title,date:g("date").value.trim(),about:g("about").value.trim(),photos};
      });
      await upsertContent("gallery",gallery);
    }
    if(block==="team"){
      const team=collectRows("#teamList","[data-team]",row=>{
        const g=f=>row.querySelector(`[data-f="${f}"]`);
        const name=g("name").value.trim();
        if(!name)return null;
        return {name,role:g("role").value.trim(),photo:photoUrl(row)};
      });
      await upsertContent("team",team);
    }
    if(block==="stories"){
      const stories=collectRows("#storiesList","[data-story]",row=>{
        const g=f=>row.querySelector(`[data-f="${f}"]`);
        const id=g("id").value.trim(),title=g("title").value.trim();
        if(!id||!title)return null;
        const body=g("body").value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
        return {id,title,date:g("date").value.trim(),tag:g("tag").value.trim(),cover:photoUrl(row),body};
      });
      await upsertContent("stories",stories);
    }
    set("Saved.","ok");
    toast("Saved");
  }catch(e){set("Error: "+(e.message||e),"err")}
}
async function seedMissingDefaults(){
  if(!confirm("Write defaults into Supabase for any keys that are missing? Existing rows are left alone."))return;
  try{
    const toWrite=[];
    for(const [k,v] of Object.entries(DEFAULTS)){
      if(STATE.content[k]===undefined)toWrite.push({key:k,value:v,updated_at:new Date().toISOString()});
    }
    if(!toWrite.length){toast("Nothing to seed");return}
    await sb("site_content?on_conflict=key",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=representation"},body:toWrite});
    await loadAll();
    renderContent();
    toast("Seeded "+toWrite.length+" keys");
  }catch(e){toast("Seed failed: "+(e.message||e))}
}

/* ---------- VENTS TAB ---------- */
function renderVents(){
  const rows=STATE.vents||[];
  $("#app").innerHTML=`
    <div class="section-head"><div><h2 style="margin:0">Vent board</h2><p class="hint">Moderate anonymous posts. Hidden posts are excluded from the public site.</p></div>
    <span class="pill">${rows.length} posts</span></div>
    ${rows.length?rows.map(v=>`
      <div class="list-item" data-vent="${esc(v.id)}">
        <div class="grow">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
            <strong>${esc(v.handle)}</strong>
            <span class="pill">${esc(v.mood||"—")}</span>
            <small style="color:var(--muted)">${new Date(v.created_at).toLocaleString()}</small>
            ${v.hidden?'<span class="pill" style="background:#fbd9d4;color:#8a2b21">Hidden</span>':""}
            ${v.reports?`<span class="pill new">${v.reports} reports</span>`:""}
          </div>
          <p style="margin:0;white-space:pre-wrap">${esc(v.body)}</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <button class="btn btn-outline btn-sm" data-hide="${esc(v.id)}" data-state="${v.hidden?"false":"true"}">${v.hidden?"Unhide":"Hide"}</button>
          <button class="btn btn-danger btn-sm" data-delete="${esc(v.id)}">Delete</button>
        </div>
      </div>`).join(""):`<div class="empty">No posts yet.</div>`}
  `;
  $$("[data-hide]").forEach(b=>b.addEventListener("click",async()=>{
    const hidden=b.dataset.state==="true";
    try{await sb(`vents?id=eq.${encodeURIComponent(b.dataset.hide)}`,{method:"PATCH",body:{hidden}});
      const v=STATE.vents.find(x=>x.id===b.dataset.hide);if(v)v.hidden=hidden;renderVents();toast(hidden?"Hidden":"Unhidden")}
    catch(e){toast("Failed: "+(e.message||e))}
  }));
  $$("[data-delete]").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("Delete this post permanently?"))return;
    try{await sb(`vents?id=eq.${encodeURIComponent(b.dataset.delete)}`,{method:"DELETE"});
      STATE.vents=STATE.vents.filter(x=>x.id!==b.dataset.delete);renderVents();toast("Deleted")}
    catch(e){toast("Failed: "+(e.message||e))}
  }));
}

/* ---------- STORY REPLIES TAB ---------- */
function renderStories(){
  const rows=STATE.storyReplies||[];
  const stories=(STATE.content.stories)||DEFAULTS.stories||[];
  const titleFor=id=>(stories.find(s=>s.id===id)||{}).title||id;
  $("#app").innerHTML=`
    <div class="section-head"><div><h2 style="margin:0">Story replies</h2><p class="hint">Anonymous replies on Stories posts. Delete any that are unkind or unsafe.</p></div>
    <span class="pill">${rows.length} replies</span></div>
    ${rows.length?rows.map(r=>`
      <div class="list-item">
        <div class="grow">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
            <strong>${esc(r.handle)}</strong>
            <span class="pill">${esc(titleFor(r.story_id))}</span>
            <small style="color:var(--muted)">${new Date(r.created_at).toLocaleString()}</small>
          </div>
          <p style="margin:0;white-space:pre-wrap">${esc(r.body)}</p>
        </div>
        <button class="btn btn-danger btn-sm" data-del-story="${esc(r.id)}">Delete</button>
      </div>`).join(""):`<div class="empty">No replies yet.</div>`}
  `;
  $$("[data-del-story]").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("Delete this reply?"))return;
    try{await sb(`story_replies?id=eq.${encodeURIComponent(b.dataset.delStory)}`,{method:"DELETE"});
      STATE.storyReplies=STATE.storyReplies.filter(x=>x.id!==b.dataset.delStory);renderStories();toast("Deleted")}
    catch(e){toast("Failed: "+(e.message||e))}
  }));
}

/* ---------- global listeners: photo fields, expand/collapse, live titles ---------- */
document.addEventListener("change",async e=>{
  const inp=e.target.closest("[data-pf-upload]");
  if(!inp||!inp.files.length)return;
  const box=inp.closest("[data-photo]"),file=inp.files[0];
  inp.value="";
  const st=$(".pf-status",box);
  box.dataset.busy="1";st.textContent="Uploading…";
  try{
    let url,msg;
    if(box.dataset.slot){url=await uploadImage(slotKeyFor(box),file);msg="Uploaded and live."}
    else{url=await uploadFile(box.dataset.prefix||"misc",file);msg="Uploaded. Press Save to publish."}
    setPhoto(box,url);$(".pf-status",box).textContent=msg;
  }catch(err){st.textContent="";toast("Upload failed: "+(err.message||err))}
  delete box.dataset.busy;
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-pf-clear]");
  if(b){
    const box=b.closest("[data-photo]");
    if(box.dataset.slot){
      if(!confirm("Remove this photo from the site now?"))return;
      try{await removeImage(slotKeyFor(box));setPhoto(box,"");toast("Removed")}
      catch(err){toast("Couldn't remove: "+(err.message||err))}
    }else setPhoto(box,"");
    return;
  }
  const x=e.target.closest("[data-expand]");
  if(x){
    const open=x.dataset.expand==="all";
    $$("details[data-acc]").forEach(d=>{d.open=open;STATE.open[d.dataset.acc]=open});
  }
});
document.addEventListener("toggle",e=>{
  const d=e.target;
  if(d&&d.dataset&&d.dataset.acc)STATE.open[d.dataset.acc]=d.open;
},true);
document.addEventListener("input",e=>{
  const inp=e.target.closest('.item [data-f="title"], .item [data-f="name"]');
  if(!inp)return;
  const t=inp.closest(".item").querySelector("[data-title]");
  if(t)t.textContent=inp.value.trim()||t.dataset.fallback;
});

/* ---------- BOOT ---------- */
async function boot(){
  if(!SB.url||!SB.anonKey){renderLogin();return}
  const s=session();
  if(!s||!s.access_token){renderLogin();return}
  renderShell();
  $("#app").innerHTML=`<div class="loading"><div class="spinner"></div><p>Loading…</p></div>`;
  await loadAll();
  renderShell();
  renderTab();
}
boot();
</script>
